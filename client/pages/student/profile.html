<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Univision — Profile</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    .page-wrap { padding: 32px; max-width: 800px; margin: 0 auto; margin-top: var(--nav-h); }
    .page-header { margin-bottom: 28px; }
    .page-header h1 { font-size: 1.5rem; font-weight: 800; }
    .page-header p  { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }

    .profile-card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
    }
    .profile-hero {
      padding: 32px 28px; display: flex; align-items: center; gap: 22px;
      border-bottom: 1px solid var(--border); flex-wrap: wrap;
    }
    .avatar {
      width: 72px; height: 72px; border-radius: 50%;
      background: rgba(var(--accent-rgb),.12); border: 2px solid rgba(var(--accent-rgb),.25);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; color: var(--accent); flex-shrink: 0;
    }
    .hero-name { font-size: 1.3rem; font-weight: 800; }
    .hero-name-ar { font-size: 1rem; color: var(--text-muted); margin-top: 2px; direction: rtl; }
    .hero-id { font-size: 0.8rem; color: var(--text-muted); margin-top: 6px; }
    .hero-email {
      margin-left: auto; font-size: 0.82rem; color: var(--accent);
      background: rgba(var(--accent-rgb),.08); border: 1px solid rgba(var(--accent-rgb),.15);
      padding: 6px 14px; border-radius: 99px;
    }

    .info-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0;
    }
    @media (max-width: 600px) { .info-grid { grid-template-columns: 1fr; } }

    .info-item {
      padding: 18px 28px; border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }
    .info-item:nth-child(even) { border-right: none; }
    .info-item:nth-last-child(-n+2) { border-bottom: none; }
    @media (max-width: 600px) {
      .info-item { border-right: none; }
      .info-item:last-child { border-bottom: none; }
      .info-item:nth-last-child(2) { border-bottom: 1px solid var(--border); }
    }

    .info-lbl { font-size: 0.68rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 5px; }
    .info-val { font-size: 0.92rem; font-weight: 600; }
    .info-val.empty-val { color: var(--text-muted); font-weight: 400; font-style: italic; }

    .grade-badge-hero {
      display: inline-flex; align-items: center; gap: 7px;
      background: rgba(var(--accent-rgb),.1); border: 1px solid rgba(var(--accent-rgb),.25);
      border-radius: 99px; padding: 5px 14px; margin-top: 8px;
      font-size: 0.78rem; font-weight: 700; color: var(--accent);
    }

    .empty { color: var(--text-muted); font-size: 0.88rem; padding: 40px; text-align: center; }
  </style>
  <script src="/js/theme.js"></script>
</head>
<body>

  <nav class="navbar">
    <div class="nav-left">
      <div class="logo">
        <img src="/assets/logo.png" alt="UniVision" style="height:52px;width:auto;">
      </div>
      <div class="nav-user"><span>Student</span><strong id="navName">—</strong></div>
    </div>
    <ul class="nav-menu">
      <li class="nav-item"><a href="home.html"><i class="fas fa-th-large"></i><span>Home</span></a></li>
      <li class="nav-item"><a href="grades.html"><i class="fas fa-star"></i><span>Grades</span></a></li>
      <li class="nav-item"><a href="attendance.html"><i class="fas fa-calendar-check"></i><span>Attendance</span></a></li>
      <li class="nav-item"><a href="comparison.html"><i class="fas fa-balance-scale"></i><span>Performance</span></a></li>
      <li class="nav-item"><a href="reports.html"><i class="fas fa-chart-bar"></i><span>Reports</span></a></li>
      <li class="nav-item"><a href="schedule.html"><i class="fas fa-clock"></i><span>Schedule</span></a></li>
      <li class="nav-item active"><a href="profile.html"><i class="fas fa-user"></i><span>Profile</span></a></li>
    </ul>
    <button id="logoutBtn" style="display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--radius-sm);font-size:0.85rem;font-weight:600;color:var(--danger);border:1px solid rgba(239,68,68,.25);background:rgba(239,68,68,.06);cursor:pointer;transition:all .2s;">
      <i class="fas fa-sign-out-alt"></i><span>Logout</span>
    </button>
  </nav>

  <div class="page-wrap">
    <div class="page-header">
      <h1>Profile</h1>
      <p>Your personal and academic information</p>
    </div>

    <div class="profile-card" id="profileCard">
      <div class="empty"><i class="fas fa-spinner fa-spin"></i> Loading…</div>
    </div>
  </div>

  <script type="module">
    import { Auth, StudentAPI } from "/js/student-api.js";

    const { id, role, name } = Auth.getSession();
    if (!id || role === "doctor" || role === "admin") {
      window.location.href = (role === "doctor" || role === "admin") ? "doctor.html" : "/";
    }
    document.getElementById("navName").textContent = name || "—";
    document.getElementById("logoutBtn").addEventListener("click", () => Auth.logout());

    function val(v) {
      return v ? `<span class="info-val">${v}</span>` : `<span class="info-val empty-val">—</span>`;
    }

    const GRADE_INFO = {
      1: { label: "First Year",  title: "Freshman",  icon: "fa-seedling" },
      2: { label: "Second Year", title: "Sophomore", icon: "fa-book-open" },
      3: { label: "Third Year",  title: "Junior",    icon: "fa-flask" },
      4: { label: "Fourth Year", title: "Senior",    icon: "fa-graduation-cap" },
    };

    try {
      const p = await StudentAPI.profile(id);
      const grade = p.grade || 1;
      const gi    = GRADE_INFO[grade] || GRADE_INFO[1];
      const card  = document.getElementById("profileCard");
      card.innerHTML = `
        <div class="profile-hero">
          <div class="avatar"><i class="fas fa-user-graduate"></i></div>
          <div>
            <div class="hero-name">${p.name_en || name || "—"}</div>
            ${p.name_ar ? `<div class="hero-name-ar">${p.name_ar}</div>` : ""}
            <div class="hero-id">ID: ${id}</div>
            <div class="grade-badge-hero">
              <i class="fas ${gi.icon}"></i>
              Grade ${grade} &nbsp;·&nbsp; ${gi.label} &nbsp;·&nbsp; ${gi.title}
            </div>
          </div>
          ${p.university_email ? `<div class="hero-email"><i class="fas fa-envelope"></i> ${p.university_email}</div>` : ""}
        </div>
        <div class="info-grid">
          <div class="info-item"><div class="info-lbl">Academic Year</div><span class="info-val">${gi.label} — ${gi.title}</span></div>
          <div class="info-item"><div class="info-lbl">Grade Level</div><span class="info-val">Grade ${grade} of 4</span></div>
          <div class="info-item"><div class="info-lbl">National ID</div>${val(p.national_id)}</div>
          <div class="info-item"><div class="info-lbl">Date of Birth</div>${val(p.dob)}</div>
          <div class="info-item"><div class="info-lbl">Birthplace</div>${val(p.birthplace)}</div>
          <div class="info-item"><div class="info-lbl">Nationality</div>${val(p.nationality)}</div>
          <div class="info-item"><div class="info-lbl">Gender</div>${val(p.gender)}</div>
          <div class="info-item"><div class="info-lbl">Religion</div>${val(p.religion)}</div>
          <div class="info-item"><div class="info-lbl">Phone</div>${val(p.phone)}</div>
          <div class="info-item"><div class="info-lbl">Personal Email</div>${val(p.email)}</div>
          <div class="info-item"><div class="info-lbl">Address</div>${val(p.address)}</div>
          <div class="info-item"><div class="info-lbl">University Email</div>${val(p.university_email)}</div>
        </div>
      `;
    } catch (err) {
      document.getElementById("profileCard").innerHTML = `<div class="empty">Profile not found.</div>`;
    }
  </script>
</body>
</html>
