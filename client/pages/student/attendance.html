<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Univision — Attendance</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    .page-wrap { padding: 32px; max-width: 1000px; margin: 0 auto; margin-top: var(--nav-h); }
    .page-header { margin-bottom: 28px; }
    .page-header h1 { font-size: 1.5rem; font-weight: 800; }
    .page-header p  { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }

    .overall-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 24px 28px; margin-bottom: 28px;
      display: flex; align-items: center; gap: 28px; flex-wrap: wrap;
    }
    .overall-val { font-size: 2.6rem; font-weight: 800; line-height: 1; }
    .overall-val.safe    { color: var(--success); }
    .overall-val.warning { color: var(--warning, #f59e0b); }
    .overall-val.danger  { color: var(--danger); }
    .overall-lbl { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-top: 4px; }
    .overall-detail { font-size: 0.85rem; color: var(--text-secondary); }

    .subject-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 20px 22px; margin-bottom: 14px;
    }
    .subject-card.danger  { border-color: rgba(239,68,68,.35); }
    .subject-card.warning { border-color: rgba(245,158,11,.3); }
    .subject-card.safe    { border-color: rgba(74,222,128,.2); }

    .subject-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .subject-name { font-size: 0.95rem; font-weight: 700; }
    .status-badge {
      font-size: 0.72rem; font-weight: 700; padding: 4px 10px;
      border-radius: 99px; text-transform: uppercase; letter-spacing: .5px;
    }
    .status-badge.safe    { background: rgba(74,222,128,.12);  color: var(--success); }
    .status-badge.warning { background: rgba(245,158,11,.12);  color: #f59e0b; }
    .status-badge.danger  { background: rgba(239,68,68,.12);   color: var(--danger); }

    .att-progress { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .att-bar { flex: 1; height: 8px; background: rgba(255,255,255,.07); border-radius: 99px; overflow: hidden; }
    .att-fill { height: 100%; border-radius: 99px; transition: width .4s; }
    .att-fill.safe    { background: var(--success); }
    .att-fill.warning { background: #f59e0b; }
    .att-fill.danger  { background: var(--danger); }
    .att-pct { font-size: 0.9rem; font-weight: 800; width: 42px; text-align: right; }

    .att-counts { font-size: 0.78rem; color: var(--text-muted); }
    .att-msg    { font-size: 0.8rem; margin-top: 8px; color: var(--text-secondary); }

    .empty { color: var(--text-muted); font-size: 0.88rem; padding: 30px 0; text-align: center; }
    @media (max-width: 768px) {
      .page-wrap { padding: 20px 16px; }
      .overall-card { flex-direction: column; gap: 12px; padding: 18px; }
      .overall-val { font-size: 2rem; }
      .subject-card { padding: 16px; }
      .subject-head { flex-direction: column; align-items: flex-start; gap: 8px; }
    }
  </style>
  <script src="/js/theme.js"></script>
</head>
<body>

  <nav class="navbar">
    <div class="nav-left">
      <div class="logo">
        <img src="/assets/logo.png" alt="UniVision" style="height:52px;width:auto;">
      </div>
      <div class="nav-user"><span>Student</span><strong id="navName">—</strong></div>
    </div>
    <button class="nav-toggle" onclick="document.querySelector('.nav-menu').classList.toggle('open')"><i class="fas fa-bars"></i></button>
    <ul class="nav-menu">
      <li class="nav-item"><a href="home.html"><i class="fas fa-th-large"></i><span>Home</span></a></li>
      <li class="nav-item"><a href="grades.html"><i class="fas fa-star"></i><span>Grades</span></a></li>
      <li class="nav-item active"><a href="attendance.html"><i class="fas fa-calendar-check"></i><span>Attendance</span></a></li>
      <li class="nav-item"><a href="comparison.html"><i class="fas fa-balance-scale"></i><span>Performance</span></a></li>
      <li class="nav-item"><a href="reports.html"><i class="fas fa-chart-bar"></i><span>Reports</span></a></li>
      <li class="nav-item"><a href="schedule.html"><i class="fas fa-clock"></i><span>Schedule</span></a></li>
      <li class="nav-item"><a href="profile.html"><i class="fas fa-user"></i><span>Profile</span></a></li>
    </ul>
    <div class="notif-bell" id="notifBell"><i class="fas fa-bell"></i><span class="notif-badge-count" id="notifCount" style="display:none;">0</span><div class="notif-dropdown" id="notifDropdown"></div></div>
    <button id="logoutBtn" style="display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--radius-sm);font-size:0.85rem;font-weight:600;color:var(--danger);border:1px solid rgba(239,68,68,.25);background:rgba(239,68,68,.06);cursor:pointer;transition:all .2s;">
      <i class="fas fa-sign-out-alt"></i><span>Logout</span>
    </button>
  </nav>

  <div class="page-wrap">
    <div class="page-header">
      <h1>Attendance</h1>
      <p>Track your attendance across all courses</p>
    </div>

    <div class="overall-card" id="overallCard">
      <div class="empty"><i class="fas fa-spinner fa-spin"></i> Loading…</div>
    </div>

    <div id="subjectList"></div>
  </div>

  <script type="module">
    import { Auth, StudentAPI } from "/js/student-api.js";
    import { initNotifications } from "/js/notifications.js";
    import { initChatbot } from "/js/chatbot.js";

    const { id, role, name } = Auth.getSession();
    if (!id || role === "doctor" || role === "admin") {
      window.location.href = (role === "doctor" || role === "admin") ? "doctor.html" : "/";
    }
    initNotifications(id);
    initChatbot(id);
    document.getElementById("navName").textContent = name || "—";
    document.getElementById("logoutBtn").addEventListener("click", () => Auth.logout());

    function statusClass(pct) {
      return pct >= 75 ? "safe" : pct >= 60 ? "warning" : "danger";
    }

    try {
      const data = await StudentAPI.attendance(id);
      const overall = data.overall;
      const oc = document.getElementById("overallCard");

      if (overall && overall.total) {
        const sc = statusClass(overall.percentage ?? 0);
        oc.innerHTML = `
          <div>
            <div class="overall-val ${sc}">${overall.percentage ?? 0}%</div>
            <div class="overall-lbl">Overall Attendance</div>
          </div>
          <div class="overall-detail">
            ${overall.attended} attended out of ${overall.total} total classes
          </div>
        `;
      } else {
        oc.innerHTML = `<div class="empty">No attendance data yet.</div>`;
      }

      const subEl = document.getElementById("subjectList");
      if (!data.subjects || !data.subjects.length) {
        subEl.innerHTML = `<div class="empty">No subject attendance records yet.</div>`;
      } else {
        subEl.innerHTML = data.subjects.map(s => {
          const sc = statusClass(s.percentage ?? 0);
          return `
          <div class="subject-card ${sc}">
            <div class="subject-head">
              <div class="subject-name">${s.course_name}</div>
              <span class="status-badge ${sc}">${sc}</span>
            </div>
            <div class="att-progress">
              <div class="att-bar">
                <div class="att-fill ${sc}" style="width:${s.percentage ?? 0}%"></div>
              </div>
              <div class="att-pct">${s.percentage ?? 0}%</div>
            </div>
            <div class="att-counts">${s.attended} / ${s.total} classes attended</div>
            ${s.message ? `<div class="att-msg"><i class="fas fa-info-circle"></i> ${s.message}</div>` : ""}
          </div>`;
        }).join("");
      }
    } catch (err) {
      console.error(err);
    }
  </script>
</body>
</html>
