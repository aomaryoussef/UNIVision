<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Univision — Course Materials</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    .page-wrap { padding: 0 32px 48px; max-width: 1200px; margin: 0 auto; margin-top: var(--nav-h); }

    .mat-hero {
      position: relative; overflow: hidden;
      background: linear-gradient(135deg, rgba(var(--accent-rgb),.12) 0%, rgba(59,130,246,.08) 50%, rgba(var(--accent-rgb),.04) 100%);
      border: 1px solid rgba(var(--accent-rgb),.12);
      border-radius: var(--radius); padding: 32px 36px; margin: 24px 0 28px;
    }
    .mat-hero::before {
      content:''; position:absolute; top:-60px; right:-40px; width:200px; height:200px; border-radius:50%;
      background:radial-gradient(circle,rgba(var(--accent-rgb),.1),transparent 70%); pointer-events:none;
    }
    .mat-hero h1 {
      font-size:1.6rem; font-weight:900; margin-bottom:6px;
      background:linear-gradient(135deg,var(--text-primary),var(--accent));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }
    .mat-hero p { color:var(--text-secondary); font-size:.88rem; line-height:1.6; position:relative; z-index:1; }

    /* Filter tabs */
    .filter-tabs {
      display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap;
    }
    .filter-tab {
      padding: 8px 18px; border-radius: 99px;
      border: 1px solid var(--border); background: var(--card-bg);
      color: var(--text-secondary); font-size: .82rem; font-weight: 600;
      cursor: pointer; transition: all .2s;
    }
    .filter-tab:hover { border-color: rgba(var(--accent-rgb),.3); color: var(--text-primary); }
    .filter-tab.active {
      background: rgba(var(--accent-rgb),.1); border-color: rgba(var(--accent-rgb),.3);
      color: var(--accent);
    }

    /* Course group */
    .course-group { margin-bottom: 28px; }
    .course-group-header {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 14px; padding-bottom: 10px;
      border-bottom: 2px solid rgba(var(--accent-rgb),.12);
    }
    .course-group-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, rgba(var(--accent-rgb),.15), rgba(var(--accent-rgb),.05));
      display: flex; align-items: center; justify-content: center;
      color: var(--accent); font-size: .9rem;
    }
    .course-group-name { font-size: 1.05rem; font-weight: 800; }
    .course-group-count {
      margin-left: auto; font-size: .72rem; font-weight: 600;
      padding: 3px 10px; border-radius: 99px;
      background: rgba(var(--accent-rgb),.08); color: var(--accent);
    }

    /* Material cards */
    .mat-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }
    .mat-card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px 20px;
      display: flex; gap: 14px; align-items: flex-start;
      transition: transform .2s, border-color .2s, box-shadow .2s;
      text-decoration: none; color: var(--text-primary);
      position: relative; overflow: hidden;
    }
    .mat-card::before {
      content:''; position:absolute; top:0; left:0; right:0; height:3px;
      opacity:0; transition:opacity .3s;
    }
    .mat-card:hover::before { opacity:1; }
    .mat-card:hover {
      transform: translateY(-2px); border-color: rgba(var(--accent-rgb),.2);
      box-shadow: 0 8px 28px rgba(0,0,0,.15);
    }
    .mat-card.type-pdf::before    { background:linear-gradient(90deg,#ef4444,transparent); }
    .mat-card.type-video::before  { background:linear-gradient(90deg,#ef4444,transparent); }
    .mat-card.type-link::before   { background:linear-gradient(90deg,var(--accent),transparent); }
    .mat-card.type-document::before { background:linear-gradient(90deg,#3b82f6,transparent); }
    .mat-card.type-other::before  { background:linear-gradient(90deg,#a855f7,transparent); }

    .mat-icon {
      width: 42px; height: 42px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; flex-shrink: 0;
    }
    .mat-icon.pdf      { background: rgba(239,68,68,.1); color: #ef4444; }
    .mat-icon.video    { background: rgba(239,68,68,.1); color: #ef4444; }
    .mat-icon.link     { background: rgba(var(--accent-rgb),.1); color: var(--accent); }
    .mat-icon.document { background: rgba(59,130,246,.1); color: #3b82f6; }
    .mat-icon.other    { background: rgba(168,85,247,.1); color: #a855f7; }

    .mat-info { flex: 1; min-width: 0; }
    .mat-title { font-size: .88rem; font-weight: 700; margin-bottom: 3px; }
    .mat-desc { font-size: .78rem; color: var(--text-secondary); line-height: 1.5; margin-bottom: 6px; }
    .mat-meta { display: flex; gap: 10px; font-size: .68rem; color: var(--text-muted); flex-wrap: wrap; }
    .mat-meta i { margin-right: 3px; }
    .mat-type-badge {
      font-size: .6rem; font-weight: 700; padding: 2px 8px;
      border-radius: 99px; text-transform: uppercase; letter-spacing: .5px;
    }
    .mat-type-badge.pdf      { background: rgba(239,68,68,.1); color: #ef4444; }
    .mat-type-badge.video    { background: rgba(239,68,68,.1); color: #ef4444; }
    .mat-type-badge.link     { background: rgba(var(--accent-rgb),.1); color: var(--accent); }
    .mat-type-badge.document { background: rgba(59,130,246,.1); color: #3b82f6; }
    .mat-type-badge.other    { background: rgba(168,85,247,.1); color: #a855f7; }

    .empty-state {
      text-align: center; padding: 60px 20px; color: var(--text-muted);
    }
    .empty-state i { font-size: 3rem; margin-bottom: 16px; display: block; color: var(--accent); opacity: .3; }
    .empty-state p { font-size: .9rem; }

    .loading-state { text-align: center; color: var(--text-muted); padding: 80px 0; }
    .loading-state i { font-size: 2rem; margin-bottom: 16px; display: block; color: var(--accent); }

    @media (max-width: 768px) {
      .page-wrap { padding: 0 16px 32px; }
      .mat-hero { padding: 24px 20px; margin-top: 16px; }
      .mat-grid { grid-template-columns: 1fr; }
    }
  </style>
  <script src="/js/theme.js"></script>
</head>
<body>
  <nav class="navbar">
    <div class="nav-left">
      <div class="logo"><img src="/assets/logo.png" alt="UniVision" style="height:52px;width:auto;"></div>
      <div class="nav-user"><span>Student</span><strong id="navName">—</strong></div>
    </div>
    <button class="nav-toggle" onclick="document.querySelector('.nav-menu').classList.toggle('open')"><i class="fas fa-bars"></i></button>
    <ul class="nav-menu">
      <li class="nav-item"><a href="home.html"><i class="fas fa-th-large"></i><span>Home</span></a></li>
      <li class="nav-item"><a href="grades.html"><i class="fas fa-star"></i><span>Grades</span></a></li>
      <li class="nav-item"><a href="attendance.html"><i class="fas fa-calendar-check"></i><span>Attendance</span></a></li>
      <li class="nav-item"><a href="comparison.html"><i class="fas fa-balance-scale"></i><span>Performance</span></a></li>
      <li class="nav-item"><a href="reports.html"><i class="fas fa-chart-bar"></i><span>Reports</span></a></li>
      <li class="nav-item"><a href="schedule.html"><i class="fas fa-clock"></i><span>Schedule</span></a></li>
      <li class="nav-item"><a href="work.html"><i class="fas fa-briefcase"></i><span>Work</span></a></li>
      <li class="nav-item"><a href="simulator.html"><i class="fas fa-calculator"></i><span>Simulator</span></a></li>
      <li class="nav-item"><a href="profile.html"><i class="fas fa-user"></i><span>Profile</span></a></li>
    </ul>
    <div class="notif-bell" id="notifBell"><i class="fas fa-bell"></i><span class="notif-badge-count" id="notifCount" style="display:none;">0</span><div class="notif-dropdown" id="notifDropdown"></div></div>
    <button id="logoutBtn" style="display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--radius-sm);font-size:0.85rem;font-weight:600;color:var(--danger);border:1px solid rgba(239,68,68,.25);background:rgba(239,68,68,.06);cursor:pointer;transition:all .2s;">
      <i class="fas fa-sign-out-alt"></i><span>Logout</span>
    </button>
  </nav>

  <div class="page-wrap">
    <div class="mat-hero">
      <h1><i class="fas fa-book-open" style="margin-right:8px;"></i> Course Materials</h1>
      <p>Access lecture slides, videos, documents, and resources shared by your professors.</p>
    </div>

    <div id="loadingState" class="loading-state">
      <i class="fas fa-spinner fa-spin"></i>
      <p>Loading materials...</p>
    </div>

    <div id="content" style="display:none;">
      <div class="filter-tabs" id="filterTabs"></div>
      <div id="materialsContainer"></div>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-social">
      <a class="fb" href="https://www.facebook.com/share/1Hu8kg7tb1/?mibextid=wwXIfr" target="_blank" rel="noopener" title="Facebook"><i class="fab fa-facebook-f"></i></a>
      <a class="ig" href="https://www.instagram.com/uni.vision.1?igsh=MWE2YXpuNmdrbHNsZQ==" target="_blank" rel="noopener" title="Instagram"><i class="fab fa-instagram"></i></a>
    </div>
    &copy; 2026 UniVision. All rights reserved.
  </footer>

  <script type="module">
    import { Auth, StudentAPI } from '/js/student-api.js';
    import { initNotifications } from '/js/notifications.js';
    import { initChatbot } from '/js/chatbot.js';

    const session = Auth.getSession();
    if (!session.id || session.role !== 'student') { window.location.href = '/'; }
    initNotifications(session.id);
    initChatbot(session.id);
    document.getElementById("navName").textContent = session.name || session.id;
    document.getElementById("logoutBtn").addEventListener("click", () => Auth.logout());

    const TYPE_ICONS = { pdf:'fa-file-pdf', video:'fa-play-circle', link:'fa-external-link-alt', document:'fa-file-word', other:'fa-file' };

    try {
      const materials = await StudentAPI.materials(session.id);

      document.getElementById("loadingState").style.display = "none";
      document.getElementById("content").style.display = "";

      if (!materials.length) {
        document.getElementById("materialsContainer").innerHTML = `
          <div class="empty-state">
            <i class="fas fa-folder-open"></i>
            <p>No course materials available yet.</p>
            <p style="font-size:.78rem;margin-top:8px;">Your professors will share materials here when available.</p>
          </div>`;
      } else {
        // Group by course
        const grouped = {};
        materials.forEach(m => {
          if (!grouped[m.course_name]) grouped[m.course_name] = [];
          grouped[m.course_name].push(m);
        });
        const courseNames = Object.keys(grouped);

        // Filter tabs
        let activeFilter = 'all';
        const tabsEl = document.getElementById("filterTabs");
        tabsEl.innerHTML = `<div class="filter-tab active" data-filter="all">All Courses</div>` +
          courseNames.map(c => `<div class="filter-tab" data-filter="${c}">${c}</div>`).join('');

        tabsEl.addEventListener('click', e => {
          const tab = e.target.closest('.filter-tab');
          if (!tab) return;
          activeFilter = tab.dataset.filter;
          tabsEl.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          renderMaterials();
        });

        function renderMaterials() {
          const container = document.getElementById("materialsContainer");
          const filteredCourses = activeFilter === 'all' ? courseNames : [activeFilter];

          container.innerHTML = filteredCourses.map(course => {
            const items = grouped[course];
            return `
              <div class="course-group">
                <div class="course-group-header">
                  <div class="course-group-icon"><i class="fas fa-book"></i></div>
                  <span class="course-group-name">${course}</span>
                  <span class="course-group-count">${items.length} item${items.length > 1 ? 's' : ''}</span>
                </div>
                <div class="mat-grid">
                  ${items.map(m => {
                    const icon = TYPE_ICONS[m.type] || 'fa-file';
                    const ago = timeAgo(m.created_at);
                    return `
                      <a class="mat-card type-${m.type}" href="${m.url}" target="_blank">
                        <div class="mat-icon ${m.type}"><i class="fas ${icon}"></i></div>
                        <div class="mat-info">
                          <div class="mat-title">${m.title}</div>
                          ${m.description ? `<div class="mat-desc">${m.description}</div>` : ''}
                          <div class="mat-meta">
                            <span><i class="fas fa-user-tie"></i>${m.doctor_name || 'Unknown'}</span>
                            <span><i class="fas fa-clock"></i>${ago}</span>
                            <span class="mat-type-badge ${m.type}">${m.type}</span>
                          </div>
                        </div>
                      </a>`;
                  }).join('')}
                </div>
              </div>`;
          }).join('');
        }

        renderMaterials();

        // Log activity
        StudentAPI.logActivity(session.id, "Viewed Materials", null, "Materials").catch(() => {});
      }

    } catch (e) {
      console.error(e);
      document.getElementById("loadingState").innerHTML = `
        <i class="fas fa-exclamation-triangle" style="color:var(--danger);"></i>
        <p>Failed to load materials: ${e.message}</p>`;
    }

    function timeAgo(dateStr) {
      const d = new Date(dateStr + "Z");
      const now = new Date();
      const diff = Math.floor((now - d) / 1000);
      if (diff < 60) return "Just now";
      if (diff < 3600) return Math.floor(diff / 60) + "m ago";
      if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
      const days = Math.floor(diff / 86400);
      if (days === 1) return "Yesterday";
      if (days < 7) return days + "d ago";
      return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
    }
  </script>
</body>
</html>
